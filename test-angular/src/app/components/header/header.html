<header class="p-4 border-b bg-white shadow-sm space-y-3">
    <div class="flex items-center justify-between">
        <h1 class="text-xl font-bold text-slate-800">{{ siteName() }}</h1>
        <div class="flex items-center gap-3">
            <span class="text-sm font-medium">Count: <strong>{{ count() }}</strong></span>
            <button class="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 text-xs rounded" (click)="increment()">+1</button>
            <div class="h-4 w-px bg-slate-300"></div>
            @if (isLoggedIn()) {
                <span class="text-xs text-emerald-600 font-medium">Logged in</span>
                <button class="bg-slate-700 hover:bg-slate-800 text-white px-2.5 py-1 text-xs rounded" (click)="toggleLogin()">Logout</button>
            } @else {
                <span class="text-xs text-slate-500">Guest</span>
                <button class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 text-xs rounded" (click)="toggleLogin()">Login</button>
            }
        </div>
    </div>

    <!-- Navigation links bar -->
    <app-nav-item [navItems]="headersLink()"></app-nav-item>
</header>
